name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug]: "
type: Bug
labels: ["needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where was it observed?
      options:
        - production (main)
        - staging
        - development
        - local
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "v1.4.2 or commit SHA"
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - S1 - Outage / data loss
        - S2 - Major feature broken, no workaround
        - S3 - Workaround exists
        - S4 - Cosmetic
      default: 2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste logs (rendered as code). Remove secrets and personal data.
      render: shell
